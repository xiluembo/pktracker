name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  NDK_VERSION: '26.1.10909125'

jobs:
  build:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: android_arm64_v8a
          - abi: x86_64
            arch: android_x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
      - name: Install build dependencies and aqt
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
          python -m pip install aqtinstall==3.3.0
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: Qt
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_VERSION }}-${{ matrix.arch }}-host-aqt3.3.0-v1
      - name: Install Qt for Android and host tools
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt linux android "$QT_VERSION" ${{ matrix.arch }} -m qtmultimedia --autodesktop -O Qt
      - name: Configure
        run: |
          "$GITHUB_WORKSPACE/Qt/$QT_VERSION/${{ matrix.arch }}/bin/qt-cmake" \
            -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION" \
            -DCMAKE_ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION" \
            -DQT_HOST_PATH="$GITHUB_WORKSPACE/Qt/$QT_VERSION/gcc_64" \
            -DPKTRACKER_MOBILE_UI=ON \
            -DBUILD_TESTING=OFF
      - name: Build APK (debug signing for installation)
        run: cmake --build build --target apk --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: pktracker-android-${{ matrix.abi }}-qt${{ env.QT_VERSION }}
          path: build/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
